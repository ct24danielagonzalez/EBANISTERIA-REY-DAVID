name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GITHUB_PAGES: 'true'
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_ADMIN_UID: ${{ vars.VITE_ADMIN_UID }}
      VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validar configuración de Firebase y administrador
        shell: bash
        run: |
          required=(VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_ADMIN_UID)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta la variable de GitHub Actions: $key"
              exit 1
            fi
          done
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar aplicación
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
